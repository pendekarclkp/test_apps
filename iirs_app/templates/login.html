<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — IIRS Protocol Playbook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #e94560, #0f3460);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
      color: white;
    }
    .logo-area h2 {
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .logo-area p {
      color: rgba(255,255,255,0.55);
      font-size: 0.82rem;
    }
    .form-label {
      color: rgba(255,255,255,0.75);
      font-size: 0.88rem;
      font-weight: 500;
    }
    .form-control {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 10px;
      padding: 0.65rem 1rem;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.12);
      border-color: #e94560;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(233,69,96,0.2);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .input-group-text {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.5);
      border-radius: 10px 0 0 10px;
    }
    .btn-login {
      background: linear-gradient(135deg, #e94560, #c0392b);
      border: none;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      width: 100%;
      color: white;
      transition: all 0.3s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233,69,96,0.4);
      color: white;
    }
    .alert { border-radius: 10px; }
    .badge-bi {
      background: rgba(233,69,96,0.2);
      color: #e94560;
      border: 1px solid rgba(233,69,96,0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">
        <i class="fas fa-shield-alt"></i>
      </div>
      <h2>IIRS Protocol Playbook</h2>
      <p>Integrated Issue Response System</p>
      <span class="badge-bi">Bank Indonesia — 2026</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>{{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-user me-1"></i>Username</label>
        <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="fas fa-lock me-1"></i>Password</label>
        <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="fas fa-sign-in-alt me-2"></i>Masuk
      </button>
    </form>

    <div class="text-center mt-3">
      <small style="color:rgba(255,255,255,0.3);">
        &copy; 2026 Protokol Respons Komunikasi BI
      </small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
