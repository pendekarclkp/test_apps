<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Dashboard — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.10); padding: 2.5rem 2rem; width: 100%; max-width: 380px; }
    .login-card h1 { font-size: 1.4rem; font-weight: 700; color: #0d1b2a; margin-bottom: .25rem; }
    .login-card .sub { color: #6c757d; font-size: .85rem; margin-bottom: 1.8rem; }
    .btn-primary { background: #0d6efd; border-color: #0d6efd; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Trading Journal</h1>
    <p class="sub">Your personal crypto trade log</p>
    {% if error %}
    <div class="alert alert-danger py-2 px-3" style="font-size:.875rem">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.875rem">Password</label>
        <input type="password" name="password" class="form-control" autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Enter Dashboard</button>
    </form>
  </div>
</body>
</html>
